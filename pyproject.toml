[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "store-ready-agent"
version = "0.1.0"
description = "StoreReady Agent: a two-agent launch-readiness assistant for physical stores."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "botocore[crt]>=1.35,<2",
  "strands-agents[bedrock]==1.55.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
store_ready = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/store_ready/web_app.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["store_ready"]
